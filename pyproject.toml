[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quote-agent"
version = "0.1.0"
description = "AI request-to-quote agent for IT sourcing: messy client request in, accurate PDF quote and CRM deal out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Najah Tasfia Zumana" }]
dependencies = [
  "pydantic>=2.5",
  "requests>=2.31",
  "reportlab>=4.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50", "pandas>=2.0"]
dev = ["pytest>=8.0", "pypdf>=4.0"]

[project.scripts]
quote-agent = "quote_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
